<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WolffiaSmart • ทดลองขนาดหน้าจอ</title><style>*{box-sizing:border-box}body{margin:0;background:#e7ece4;color:#19331a;font:15px system-ui}header{padding:16px 24px;background:white;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-bottom:1px solid #dbe3d5}h1{font-size:18px;margin:0}button,select{padding:8px 12px;border:1px solid #d4dfcc;border-radius:10px;background:white;color:inherit;cursor:pointer}button.active{background:#244c1c;color:white}label{display:flex;align-items:center;gap:8px}input{width:200px;accent-color:#427c2c}#stage{margin:20px auto;width:calc(100% - 32px);overflow:hidden}#frame{border:0;display:block;transform-origin:top left;background:white;border-radius:16px;box-shadow:0 12px 40px #16301420}small{color:#5c6d55}#presets{display:flex;flex-wrap:wrap;gap:6px}</style><header><h1>ทดลองย่อ–ขยายหน้าจอ</h1><select id="page" aria-label="หน้าเว็บ"><option value="overview">ภาพรวม</option><option value="temperature">อุณหภูมิ</option><option value="ec">EC</option><option value="ph" selected>pH</option><option value="reports">รายงาน</option><option value="devices">อุปกรณ์</option></select><div id="presets"></div><label>ความกว้าง <input id="width" type="range" min="320" max="2560" value="1280"><output id="size"></output></label><small id="scale"></small></header><div id="stage"><iframe id="frame" title="ตัวอย่างเว็บตามขนาดหน้าจอ" height="960" src="/?preview=1#ph"></iframe></div><script>const slider=document.querySelector('#width'),frame=document.querySelector('#frame'),stage=document.querySelector('#stage');function resize(){const w=+slider.value,s=Math.min(1,stage.clientWidth/w);frame.style.width=w+'px';frame.style.transform='scale('+s+')';stage.style.height=960*s+'px';document.querySelector('#size').textContent=w+' px';document.querySelector('#scale').textContent='แสดงภาพที่ '+Math.round(s*100)+'% • เลื่อนภายในเว็บเพื่อดูส่วนล่าง';document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('active',+b.dataset.width===w))}for(const w of [360,390,768,1024,1280,1440,1920,2560]){const b=document.createElement('button');b.textContent=w;b.dataset.width=w;b.onclick=()=>{slider.value=w;resize()};document.querySelector('#presets').append(b)}slider.oninput=resize;document.querySelector('#page').onchange=e=>frame.src='/?preview=1#'+e.target.value;new ResizeObserver(resize).observe(stage);resize();</script></html>
